services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    # If 8000 is taken (e.g. local uvicorn), use: API_HOST_PORT=8001 docker compose up
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - ./models:/app/model:ro
    env_file:
      - path: .env
        required: false
    environment:
      - MODEL_PATH=model/extended_sh17/weights/best.pt
    restart: unless-stopped
